services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: unless-stopped
    env_file:
      - ./.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 30s
    ports:
      - "127.0.0.1:5433:5432" # Local Access (psql)
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp_server
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      MCP_HOST: 0.0.0.0
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    ports:
      - "127.0.0.1:8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
